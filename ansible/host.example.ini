[all:vars]
ansible_user=YOUR_SSH_USER
ansible_port=22
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
control_node_ip=10.0.0.1

[prod]
vm2-app ansible_host=10.0.0.2 configured_hostname=prod-app-01

[monitoring]
vm3-monitor ansible_host=10.0.0.3 configured_hostname=infra-monitor-01
